name: Deploy to Render

on:
  push:
    branches:
      - main  # Change to your branch if different

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # 3. Install frontend dependencies
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      # 4. Build React frontend
      - name: Build React frontend
        run: |
          cd frontend
          npm run build
        env:
          # Add any React env vars here if needed, e.g.:
          # REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          CI: false  # Prevents treating warnings as errors

      # 5. Install backend dependencies
      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      # 6. (Optional) Run tests — add your test command here if you have tests
      # - name: Run tests
      #   run: |
      #     cd backend
      #     npm test

      # 7. Trigger Render Deploy Hook (manual deployment)
      - name: Trigger Render Deploy
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            --fail \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
        # If the hook returns non-2xx, the step fails and deployment is blocked